[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-graph-indexer"
version = "1.0.0"
description = "Tree-Sitter AST & Knowledge Graph hybrid code indexer"
authors = [{ name = "Enterprise AI Team" }]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.21.0",
    "networkx>=3.1",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]
